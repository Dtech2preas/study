name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download TFLite AI Model
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/model.tflite "https://raw.githubusercontent.com/tensorflow/tensorflow/master/tensorflow/lite/java/demo/app/src/main/assets/mobilenet_v1_1.0_224_quant.tflite" || touch app/src/main/assets/model.tflite
        echo "Model downloaded successfully."

    - name: Get Short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build Release APKs
      env:
        APP_VERSION_TAG: "v1.2-${{ steps.vars.outputs.sha_short }}"
      run: ./gradlew :app:assembleRelease

    - name: Sign APK
      uses: ilharp/sign-android-release@v1
      id: sign_app
      with:
        releaseDir: app/build/outputs/apk/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
        buildToolsVersion: 33.0.1

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v1.2-${{ steps.vars.outputs.sha_short }}"
        name: "Release v1.2-${{ steps.vars.outputs.sha_short }}"
        files: |
          ${{steps.sign_app.outputs.signedFile}}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}